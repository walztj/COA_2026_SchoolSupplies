<style>
  :root {
    --red: #b91c1c; --red-dark: #7f1d1d; --red-soft: #fef2f2;
    --ink: #2a2016; --paper: #faf8f4; --cream: #f0ece3; --rule: #ddd8cc; --muted: #7a7264;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

  /* ── Header ── */
  header { background: white; border-bottom: 3px solid var(--red); padding: 1.25rem 1.5rem; text-align: center; }
  .logo-img { height: 72px; width: auto; display: block; margin: 0 auto 10px; }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--ink); line-height: 1.3; }
  header p { font-size: 13px; color: var(--muted); margin-top: 3px; }

  /* ── Sections ── */
  .section { padding: 1.25rem 1rem; border-bottom: 1px solid var(--rule); }
  .section.hidden { display: none; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: block; }

  /* ── Grade grid ── */
  .grades-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 9px; }
  .grade-card {
    border: 1.5px solid var(--rule); border-radius: 12px; padding: 13px 12px;
    background: white; transition: all 0.15s; cursor: pointer; user-select: none; -webkit-user-select: none;
    min-height: 80px;
  }
  .grade-card.selected { border-color: var(--red); background: var(--red-soft); }
  .grade-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .grade-name { font-weight: 600; font-size: 15px; }
  .grade-check {
    width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--rule);
    background: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s;
  }
  .grade-card.selected .grade-check { background: var(--red); border-color: var(--red); }
  .grade-check svg { display: none; }
  .grade-card.selected .grade-check svg { display: block; }
  .qty-row { display: flex; align-items: center; gap: 8px; opacity: 0.3; pointer-events: none; transition: opacity 0.15s; }
  .grade-card.selected .qty-row { opacity: 1; pointer-events: all; }
  .qty-label { font-size: 12px; color: var(--muted); flex: 1; }
  .qty-control { display: flex; align-items: center; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: white; }
  .qty-btn {
    width: 32px; height: 32px; border: none; background: transparent; font-size: 18px;
    cursor: pointer; color: var(--ink); display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', sans-serif; touch-action: manipulation;
  }
  .qty-btn:active { background: var(--cream); }
  .qty-val { width: 30px; text-align: center; font-size: 14px; font-weight: 600; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); height: 32px; line-height: 32px; }

  .generate-btn {
    margin-top: 1.25rem; width: 100%; padding: 16px; background: var(--red);
    color: white; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif;
    font-size: 16px; font-weight: 600; cursor: pointer; touch-action: manipulation;
    transition: background 0.15s;
  }
  .generate-btn:active { background: var(--red-dark); }
  .generate-btn:disabled { background: var(--rule); color: var(--muted); cursor: not-allowed; }

  /* ── Results header ── */
  .results-header { margin-bottom: 1rem; }
  .results-meta h2 { font-family: 'Playfair Display', serif; font-size: 1.2rem; }
  .results-meta p { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .action-btn {
    padding: 9px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--rule);
    background: white; color: var(--ink); touch-action: manipulation;
  }
  .action-btn:active { background: var(--cream); }
  .action-btn.primary { background: var(--ink); color: white; border-color: var(--ink); }

  /* ── Filter pills ── */
  .filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; overflow-x: auto; padding-bottom: 2px; }
  .filter-bar::-webkit-scrollbar { display: none; }
  .fpill {
    padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
    border: 1.5px solid var(--rule); background: white; cursor: pointer; color: var(--ink);
    white-space: nowrap; font-family: 'DM Sans', sans-serif; touch-action: manipulation; flex-shrink: 0;
  }
  .fpill.active { background: var(--red); color: white; border-color: var(--red); }

  /* ── Search ── */
  .search-bar { position: relative; margin-bottom: 1rem; }
  .search-bar input {
    width: 100%; padding: 12px 14px 12px 38px; border: 1px solid var(--rule); border-radius: 10px;
    font-family: 'DM Sans', sans-serif; font-size: 16px; color: var(--ink);
    background: white; outline: none; -webkit-appearance: none;
  }
  .search-bar input:focus { border-color: var(--red); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 16px; }

  /* ── Category groups ── */
  .cat-group { margin-bottom: 1.75rem; }
  .cat-heading {
    font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase;
    color: var(--muted); padding: 0 0 7px; border-bottom: 2px solid var(--rule);
    margin-bottom: 2px; display: flex; align-items: center; gap: 7px;
  }
  .cat-heading span { font-size: 15px; }

  /* ── Mobile-first item cards instead of table ── */
  .item-row {
    display: flex; align-items: flex-start; padding: 11px 4px;
    border-bottom: 1px solid var(--rule); gap: 10px;
  }
  .item-row:last-child { border-bottom: none; }
  .item-name { flex: 1; font-size: 14px; line-height: 1.4; }
  .item-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .item-qty { font-size: 22px; font-weight: 700; color: var(--red); line-height: 1; }
  .item-qty-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; max-width: 130px; }
  .grade-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }
  .badge-K  { background:#ede9fe;color:#5b21b6; } .badge-1 { background:#d1fae5;color:#065f46; }
  .badge-2  { background:#fef3c7;color:#92400e; } .badge-3 { background:#fee2e2;color:#991b1b; }
  .badge-4  { background:#dbeafe;color:#1e40af; } .badge-5 { background:#fce7f3;color:#9d174d; }
  .badge-6  { background:#e0f2fe;color:#075985; } .badge-7 { background:#f3e8ff;color:#6b21a8; }
  .badge-8  { background:#ecfdf5;color:#047857; }

  .empty { text-align: center; padding: 2.5rem; color: var(--muted); font-size: 14px; }

  /* ── Got it checkbox ── */
  .item-row { cursor: pointer; transition: background 0.15s; border-radius: 6px; }
  .item-row.grabbed { background: #f0fdf4; opacity: 0.6; }
  .item-row.grabbed .item-name { text-decoration: line-through; color: var(--muted); }
  .item-row.grabbed .item-qty { color: #16a34a; }
  .got-it {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--rule);
    background: white; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px; transition: all 0.15s;
  }
  .item-row.grabbed .got-it { background: #16a34a; border-color: #16a34a; }
  .got-it svg { display: none; }
  .item-row.grabbed .got-it svg { display: block; }

  /* ── Progress bar ── */
  .progress-wrap { margin-bottom: 1rem; }
  .progress-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .progress-track { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: #16a34a; border-radius: 3px; transition: width 0.3s; width: 0%; }

  @media print {
    header .logo-img { height: 50px; }
    #configSection, .filter-bar, .search-bar, .actions { display: none !important; }
    #resultsSection { display: block !important; border: none; }
    .item-qty { color: #000; }
  }

  /* Slightly wider screens get a 2-col grade grid */
  @media (min-width: 480px) {
    .section { padding: 1.5rem; }
    header { padding: 1.5rem 2rem; }
    .logo-img { height: 84px; }
    header h1 { font-size: 1.3rem; }
    .grades-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
  @media (min-width: 768px) {
    .section { padding: 2rem 2.5rem; }
    .logo-img { height: 96px; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>

<script>
const CATEGORIES = [
  { key:'writing',   label:'Writing Instruments', icon:'✏️', kw:['pencil','pen ','pens','sharpie','marker','crayon','colored pencil','dry erase','highlighter','paint'] },
  { key:'paper',     label:'Paper & Notebooks',   icon:'📓', kw:['notebook','composition book','paper','tablet','index card','sticky note','sketch pad'] },
  { key:'folders',   label:'Folders & Binders',   icon:'📁', kw:['folder','binder','accordion'] },
  { key:'glue',      label:'Glue & Adhesives',     icon:'🔧', kw:['glue'] },
  { key:'tools',     label:'Tools & Accessories',  icon:'✂️', kw:['scissors','ruler','eraser','pencil pouch','school box','pouch'] },
  { key:'tech',      label:'Tech & Electronics',   icon:'🎧', kw:['headphone','calculator'] },
  { key:'classroom', label:'Classroom Supplies',   icon:'🧴', kw:['tissue','wipe','paper towel','hand sanitizer','zipper bag'] },
];
const CAT_OTHER = { key:'other', label:'Other', icon:'📦' };
const BADGE_KEYS = ['K','1','2','3','4','5','6','7','8'];

function categorize(name) {
  const low = name.toLowerCase();
  for (const c of CATEGORIES) if (c.kw.some(k=>low.includes(k))) return c;
  return CAT_OTHER;
}

// Build grade cards on load
(function init() {
  const grid = document.getElementById('gradesGrid');
  GRADES.forEach((grade, i) => {
    selections[grade] = 0;
    const card = document.createElement('div');
    card.className = 'grade-card';
    card.innerHTML = `<div class="grade-card-top"><span class="grade-name">${grade}</span><div class="grade-check"><svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><div class="qty-row"><span class="qty-label">Children</span><div class="qty-control"><button class="qty-btn" onclick="event.stopPropagation();chQty('${grade}',-1,${i})">−</button><span class="qty-val" id="qv${i}">1</span><button class="qty-btn" onclick="event.stopPropagation();chQty('${grade}',1,${i})">+</button></div></div>`;
    card.addEventListener('click', () => togGrade(grade, card, i));
    grid.appendChild(card);
  });
})();

function togGrade(grade, card, i) {
  if (selections[grade] === 0) { selections[grade] = 1; card.classList.add('selected'); document.getElementById('qv'+i).textContent = 1; }
  else { selections[grade] = 0; card.classList.remove('selected'); }
  document.getElementById('generateBtn').disabled = !Object.values(selections).some(v=>v>0);
}

function chQty(grade, delta, i) {
  const next = Math.max(1, (selections[grade]||1) + delta);
  selections[grade] = next; document.getElementById('qv'+i).textContent = next;
}

function generate() {
  const map = {};
  for (const [grade, count] of Object.entries(selections)) {
    if (!count) continue;
    for (const [item, qty] of (DATA[grade]||[])) {
      if (!map[item]) map[item] = {};
      map[item][grade] = (map[item][grade]||0) + qty * count;
    }
  }
  consolidated = Object.entries(map).map(([item, breakdown]) => ({
    item, cat: categorize(item), breakdown,
    total: Object.values(breakdown).reduce((a,b)=>a+b,0),
    grades: Object.keys(breakdown)
  })).sort((a,b) => a.item.localeCompare(b.item));

  grabbed = new Set();
  buildPills();
  renderList();
  const sel = Object.entries(selections).filter(([,v])=>v>0);
  document.getElementById('resultsMeta').textContent = sel.map(([g,c])=>c>1?`${g} ×${c}`:g).join(' · ');
  document.getElementById('resultsSection').classList.remove('hidden');
  document.getElementById('resultsSection').scrollIntoView({behavior:'smooth'});
}

function buildPills() {
  activeFilter = 'all';
  const bar = document.getElementById('filterBar'); bar.innerHTML = '';
  const sel = Object.entries(selections).filter(([,v])=>v>0).map(([g])=>g);
  [['all','All'], ...sel.map(g=>[g, g.replace(' Grade','').replace('Kindergarten','K')])].forEach(([val,label]) => {
    const b = document.createElement('button');
    b.className = 'fpill' + (val==='all'?' active':''); b.textContent = label;
    b.onclick = () => { activeFilter=val; document.querySelectorAll('.fpill').forEach(x=>x.classList.remove('active')); b.classList.add('active'); renderList(); };
    bar.appendChild(b);
  });
}

function updateProgress() {
  const total = consolidated.length;
  const done = grabbed.size;
  document.getElementById('progressText').textContent = `${done} of ${total}`;
  document.getElementById('progressFill').style.width = total ? (done/total*100)+'%' : '0%';
  document.getElementById('progressWrap').classList.toggle('hidden', total===0);
}

function toggleGrab(itemKey, div) {
  if (grabbed.has(itemKey)) grabbed.delete(itemKey);
  else grabbed.add(itemKey);
  div.classList.toggle('grabbed', grabbed.has(itemKey));
  div.querySelector('.got-it').style.background = grabbed.has(itemKey) ? '' : '';
  updateProgress();
}

function renderList() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const container = document.getElementById('listContainer'); container.innerHTML = '';
  const visGrades = activeFilter==='all'
    ? Object.entries(selections).filter(([,v])=>v>0).map(([g])=>g)
    : [activeFilter];
  const visible = consolidated.filter(row => {
    if (activeFilter!=='all' && !row.grades.includes(activeFilter)) return false;
    if (q && !row.item.toLowerCase().includes(q)) return false;
    return true;
  });
  if (!visible.length) { document.getElementById('emptyMsg').classList.remove('hidden'); updateProgress(); return; }
  document.getElementById('emptyMsg').classList.add('hidden');

  [...CATEGORIES, CAT_OTHER].forEach(cat => {
    const rows = visible.filter(r => r.cat.key === cat.key);
    if (!rows.length) return;
    const group = document.createElement('div'); group.className = 'cat-group';
    group.innerHTML = `<div class="cat-heading"><span>${cat.icon}</span>${cat.label}</div>`;
    rows.forEach(row => {
      const filteredQty = visGrades.reduce((sum,g) => sum+(row.breakdown[g]||0), 0);
      const badges = visGrades.filter(g=>row.breakdown[g]).map(g => {
        const gi = GRADES.indexOf(g);
        const bk = gi < BADGE_KEYS.length ? BADGE_KEYS[gi] : '8';
        const short = g.replace(' Grade','').replace('Kindergarten','K');
        return `<span class="grade-badge badge-${bk}">${short}: ${row.breakdown[g]}</span>`;
      }).join('');
      const isGrabbed = grabbed.has(row.item);
      const div = document.createElement('div');
      div.className = 'item-row' + (isGrabbed ? ' grabbed' : '');
      div.innerHTML = `
        <div class="got-it">
          <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="item-name">${row.item}</div>
        <div class="item-right">
          <div class="item-qty">${filteredQty}</div>
          <div class="item-qty-label">needed</div>
          <div class="badges">${badges}</div>
        </div>`;
      div.addEventListener('click', () => toggleGrab(row.item, div));
      group.appendChild(div);
    });
    container.appendChild(group);
  });
  updateProgress();
}

function copyCSV() {
  const rows = [['Category','Item','Total Qty','Grades']];
  [...CATEGORIES, CAT_OTHER].forEach(cat => {
    consolidated.filter(r=>r.cat.key===cat.key).forEach(r => {
      rows.push([cat.label, `"${r.item}"`, r.total, r.grades.join('; ')]);
    });
  });
  navigator.clipboard.writeText(rows.map(r=>r.join(',')).join('\n')).then(()=>alert('Copied to clipboard!'));
}

function startOver() {
  consolidated = []; activeFilter = 'all'; grabbed = new Set();
  GRADES.forEach((g,i) => { selections[g]=0; });
  document.querySelectorAll('.grade-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('resultsSection').classList.add('hidden');
  document.getElementById('searchInput').value = '';
  document.getElementById('generateBtn').disabled = true;
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
